<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1700" viewBox="0 0 1800 1700">
<defs>
<linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F2940"/><stop offset="1" stop-color="#1A4A6B"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#F3F8FC"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#F1F9F5"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity=".1"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
<style>
.title{font:700 42px Inter,Segoe UI,Arial;fill:#fff}.sub{font:400 19px Inter,Segoe UI,Arial;fill:#DDEAF2}
.h{font:700 27px Inter,Segoe UI,Arial;fill:#0F2940}.hs{font:600 15px Inter,Segoe UI,Arial;fill:#475569}
.ct{font:700 18px Inter,Segoe UI,Arial;fill:#0F2940}.b{font:400 14px Inter,Segoe UI,Arial;fill:#334155}.bb{font:700 14px Inter,Segoe UI,Arial;fill:#334155}
.s{font:400 12px Inter,Segoe UI,Arial;fill:#64748B}.sd{font:600 12px Inter,Segoe UI,Arial;fill:#475569}.tag{font:700 12px Inter,Segoe UI,Arial;fill:#fff}
.num{font:700 19px Inter,Segoe UI,Arial;fill:#fff}.flow{font:700 14px Inter,Segoe UI,Arial;fill:#fff}.code{font:400 12px Consolas,monospace;fill:#334155}
</style>
</defs>

<rect width="1800" height="1700" fill="#F0F4F8"/>
<rect width="1800" height="150" fill="url(#header)"/>
<text x="70" y="58" class="title">Planning: Choosing Your Architecture</text>
<text x="70" y="94" class="sub">Bounded Contexts + Decision Path + ADR + Sprint Backlog</text>
<text x="70" y="124" class="s" style="fill:#B9CEDD">Planning converts what you learned into concrete decisions for the next sprint.</text>
<rect x="1570" y="43" width="160" height="52" rx="26" fill="#fff" fill-opacity=".12"/>
<text x="1650" y="76" text-anchor="middle" class="tag" style="font-size:15px">CORHUILA · 2026</text>

<rect x="60" y="180" width="1680" height="145" rx="22" fill="#fff" stroke="#D5DEE7" stroke-width="2" filter="url(#shadow)"/>
<text x="90" y="215" class="h">What do we do in this session?</text>
<text x="90" y="241" class="hs">Architecture is not chosen by trend. It is decided, justified, and turned into work.</text>
<g transform="translate(90 265)">
<circle cx="22" cy="22" r="22" fill="#1A4A6B"/><text x="22" y="29" text-anchor="middle" class="num">1</text><text x="55" y="18" class="ct">Map</text><text x="55" y="38" class="s">Bounded contexts</text>
<line x1="230" y1="22" x2="275" y2="22" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="310" cy="22" r="22" fill="#1A4A6B"/><text x="310" y="29" text-anchor="middle" class="num">2</text><text x="343" y="18" class="ct">Decide</text><text x="343" y="38" class="s">Architecture path</text>
<line x1="520" y1="22" x2="565" y2="22" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="600" cy="22" r="22" fill="#B8730E"/><text x="600" y="29" text-anchor="middle" class="num">3</text><text x="633" y="18" class="ct">Record</text><text x="633" y="38" class="s">ADR-001</text>
<line x1="780" y1="22" x2="825" y2="22" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="860" cy="22" r="22" fill="#278B63"/><text x="860" y="29" text-anchor="middle" class="num">4</text><text x="893" y="18" class="ct">Execute</text><text x="893" y="38" class="s">Sprint backlog</text>
</g>

<!-- 1 -->
<rect x="60" y="355" width="820" height="450" rx="22" fill="url(#blue)" stroke="#B9D9EA" stroke-width="2" filter="url(#shadow)"/>
<circle cx="100" cy="400" r="25" fill="#1A4A6B"/><text x="100" y="407" text-anchor="middle" class="num">1</text>
<text x="140" y="397" class="h">Map the domain</text><text x="140" y="423" class="hs">Bounded contexts first, services later</text>
<rect x="90" y="450" width="760" height="65" rx="14" fill="#EAF4FA" stroke="#8CBFD3"/>
<text x="115" y="478" class="ct">What is a bounded context?</text><text x="115" y="501" class="b">A zone of the domain with its own language, rules, and responsibility for its data.</text>
<text x="90" y="548" class="sd">Context map: what does each context do and how does it relate to the others?</text>
<g transform="translate(95 565)">
<rect x="0" y="0" width="170" height="78" rx="12" fill="#1A4A6B"/><text x="85" y="27" text-anchor="middle" class="tag">ORDERS</text><text x="85" y="49" text-anchor="middle" class="tag" style="fill:#DDEAF2">cart · checkout</text>
<rect x="200" y="0" width="170" height="78" rx="12" fill="#278B63"/><text x="285" y="27" text-anchor="middle" class="tag">PAYMENTS</text><text x="285" y="49" text-anchor="middle" class="tag" style="fill:#E8F4EE">charge · refund</text>
<rect x="400" y="0" width="170" height="78" rx="12" fill="#4A7C9B"/><text x="485" y="27" text-anchor="middle" class="tag">INVENTORY</text><text x="485" y="49" text-anchor="middle" class="tag" style="fill:#E7F0F5">stock · reserve</text>
<rect x="600" y="0" width="170" height="78" rx="12" fill="#B8730E"/><text x="685" y="27" text-anchor="middle" class="tag">SHIPPING</text><text x="685" y="49" text-anchor="middle" class="tag" style="fill:#FFF4D9">deliver · track</text>
<line x1="170" y1="39" x2="200" y2="39" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><line x1="370" y1="39" x2="400" y2="39" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><line x1="570" y1="39" x2="600" y2="39" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="185" y="24" text-anchor="middle" class="s">reserves</text><text x="385" y="24" text-anchor="middle" class="s">places</text><text x="585" y="24" text-anchor="middle" class="s">ships</text>
</g>
<rect x="90" y="675" width="760" height="95" rx="14" fill="#FFF7E8" stroke="#E8C57A"/>
<text x="115" y="704" class="ct">Boundary rule</text><text x="115" y="729" class="bb">Boundaries follow language and data ownership.</text><text x="115" y="751" class="b">They are not drawn based on database tables or UI screens.</text>

<!-- 2 -->
<rect x="920" y="355" width="820" height="450" rx="22" fill="url(#green)" stroke="#B8D9C8" stroke-width="2" filter="url(#shadow)"/>
<circle cx="960" cy="400" r="25" fill="#1A4A6B"/><text x="960" y="407" text-anchor="middle" class="num">2</text>
<text x="1000" y="397" class="h">Choose the architecture</text><text x="1000" y="423" class="hs">Don't start with "microservices": follow a decision path</text>
<rect x="950" y="450" width="760" height="55" rx="14" fill="#E8F4EE" stroke="#A8D2BC"/>
<text x="975" y="484" class="bb">Question 1: Do the parts need to scale or deploy independently?</text>
<g transform="translate(980 535)">
<rect x="0" y="0" width="300" height="58" rx="12" fill="#fff" stroke="#C7DDE9"/><text x="150" y="23" text-anchor="middle" class="sd">Do they need to scale /</text><text x="150" y="42" text-anchor="middle" class="sd">deploy independently?</text>
<line x1="300" y1="29" x2="365" y2="29" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="19" text-anchor="middle" class="s">NO</text>
<rect x="385" y="0" width="190" height="58" rx="12" fill="#1A4A6B"/><text x="480" y="24" text-anchor="middle" class="tag">MODULAR MONOLITH</text><text x="480" y="44" text-anchor="middle" class="tag">start here</text>
<line x1="150" y1="58" x2="150" y2="100" stroke="#64748B" stroke-width="2"/><text x="166" y="83" class="s">YES</text>
<rect x="0" y="110" width="300" height="58" rx="12" fill="#fff" stroke="#C7DDE9"/><text x="150" y="133" text-anchor="middle" class="sd">Are the boundaries real?</text><text x="150" y="152" text-anchor="middle" class="s">(clear bounded ctx)</text>
<line x1="300" y1="139" x2="365" y2="139" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="129" text-anchor="middle" class="s">NO</text>
<rect x="385" y="110" width="190" height="58" rx="12" fill="#fff" stroke="#C7DDE9"/><text x="480" y="134" text-anchor="middle" class="sd">Refactor</text><text x="480" y="153" text-anchor="middle" class="s">modules first</text>
<line x1="150" y1="168" x2="150" y2="210" stroke="#64748B" stroke-width="2"/><text x="166" y="194" class="s">YES</text>
<rect x="0" y="220" width="575" height="55" rx="12" fill="#278B63"/><text x="287" y="244" text-anchor="middle" class="tag">EXTRACT SERVICE</text><text x="287" y="263" text-anchor="middle" class="tag">Only when real boundary matches real need</text>
</g>

<!-- 3 -->
<rect x="60" y="835" width="1080" height="410" rx="22" fill="#fff" stroke="#D5DEE7" stroke-width="2" filter="url(#shadow)"/>
<circle cx="100" cy="880" r="25" fill="#B8730E"/><text x="100" y="887" text-anchor="middle" class="num">3</text>
<text x="140" y="877" class="h">Record it: the ADR</text><text x="140" y="903" class="hs">The document that allows you to defend "why" months later</text>
<rect x="90" y="930" width="1020" height="65" rx="12" fill="#F5F9FC" stroke="#C7DDE9"/>
<text x="115" y="956" class="ct">ADR-001: Initial architecture</text><text x="115" y="978" class="code">docs/adr/adr-001-architecture.md · Status: Accepted · Date: 2026-08</text>
<g transform="translate(90 1015)">
<rect x="0" y="0" width="245" height="95" rx="12" fill="#F0F7FC"/><text x="20" y="27" class="ct">Context</text><text x="20" y="50" class="s">4 bounded contexts.</text><text x="20" y="69" class="s">Only Catalog needs</text><text x="20" y="86" class="s">independent scale.</text>
<rect x="260" y="0" width="245" height="95" rx="12" fill="#E8F4EE"/><text x="280" y="27" class="ct">Decision</text><text x="280" y="50" class="s">Modular monolith +</text><text x="280" y="69" class="s">extract Catalog as</text><text x="280" y="86" class="s">independent service.</text>
<rect x="520" y="0" width="245" height="95" rx="12" fill="#FFF7E8"/><text x="540" y="27" class="ct">Alternatives</text><text x="540" y="49" class="s">(a) Full microservices:</text><text x="540" y="66" class="s">high operational cost.</text><text x="540" y="83" class="s">(b) Pure monolith: wasted scale.</text>
<rect x="780" y="0" width="240" height="95" rx="12" fill="#FDF2F2"/><text x="800" y="27" class="ct">Consequences</text><text x="800" y="50" class="s">+ Catalog scales alone.</text><text x="800" y="68" class="s">- 1 call between</text><text x="800" y="85" class="s">services for consistency.</text>
</g>
<rect x="90" y="1125" width="1020" height="85" rx="12" fill="#FFF7E8" stroke="#E8C57A"/>
<text x="115" y="1153" class="ct">ADR Rule</text><text x="115" y="1176" class="b">Once accepted, the ADR remains as historical.</text><text x="115" y="1197" class="b">If the decision changes, a new ADR is created that supersedes the previous one.</text>

<!-- 5 -->
<rect x="1170" y="835" width="570" height="410" rx="22" fill="#FFF7E8" stroke="#E8C57A" stroke-width="2" filter="url(#shadow)"/>
<circle cx="1210" cy="880" r="25" fill="#B8730E"/><text x="1210" y="887" text-anchor="middle" class="num">5</text>
<text x="1250" y="877" class="h">The “12 microservices” trap</text><text x="1250" y="903" class="hs">Don't copy large companies' architecture without evidence</text>
<rect x="1200" y="930" width="510" height="80" rx="12" fill="#fff" stroke="#E8C57A"/>
<text x="1225" y="957" class="ct">What problem appears?</text><text x="1225" y="980" class="s">Deployment, tracing, versioned contracts</text><text x="1225" y="997" class="s">and data consistency become more complex.</text>
<text x="1200" y="1045" class="ct">Professional answer</text><text x="1200" y="1070" class="b">1. Ask for evidence of a real need.</text><text x="1200" y="1093" class="b">2. Start with modular monolith.</text><text x="1200" y="1116" class="b">3. Define in the ADR what will measure a future change.</text><text x="1200" y="1139" class="b">4. Extract only when the trigger exists.</text>
<rect x="1200" y="1160" width="510" height="55" rx="10" fill="#B8730E"/><text x="1455" y="1183" text-anchor="middle" class="tag">EVIDENCE &gt; TREND</text><text x="1455" y="1202" text-anchor="middle" class="tag">Decide with data, not with prestige.</text>

<!-- 6 -->
<rect x="60" y="1275" width="820" height="330" rx="22" fill="url(#blue)" stroke="#B9D9EA" stroke-width="2" filter="url(#shadow)"/>
<circle cx="100" cy="1320" r="25" fill="#278B63"/><text x="100" y="1327" text-anchor="middle" class="num">6</text>
<text x="140" y="1317" class="h">Turn the decision into the sprint backlog</text><text x="140" y="1343" class="hs">The architectural decision must result in verifiable work.</text>
<rect x="90" y="1370" width="760" height="82" rx="12" fill="#fff" stroke="#C7DDE9"/>
<text x="115" y="1397" class="ct">User story</text><text x="115" y="1420" class="b">"As a team, we want to isolate Catalog behind a port</text><text x="115" y="1439" class="b">so we can extract it later as a service."</text>
<rect x="90" y="1470" width="370" height="105" rx="12" fill="#E8F4EE" stroke="#A8D2BC"/><text x="115" y="1497" class="ct">Acceptance criteria</text><text x="115" y="1520" class="s">• No module imports Catalog internals.</text><text x="115" y="1540" class="s">• All access goes through the port.</text><text x="115" y="1560" class="s">• Tests still pass.</text>
<rect x="480" y="1470" width="370" height="105" rx="12" fill="#F0F7FC" stroke="#B9D9EA"/><text x="505" y="1497" class="ct">Sprint discipline</text><text x="505" y="1520" class="s">Estimate · Prioritize · MoSCoW</text><text x="505" y="1540" class="s">Commit only what fits in the sprint.</text><text x="505" y="1560" class="s">Architecture → stories → verifiable criteria.</text>

<!-- 7 -->
<rect x="920" y="1275" width="820" height="330" rx="22" fill="#FDF2F2" stroke="#E8A0A0" stroke-width="2" filter="url(#shadow)"/>
<circle cx="960" cy="1320" r="25" fill="#B91C1C"/><text x="960" y="1327" text-anchor="middle" class="num">7</text>
<text x="1000" y="1317" class="h">Common mistakes</text><text x="1000" y="1343" class="hs">Mistakes that break the decision before you start building.</text>
<g transform="translate(950 1375)">
<rect x="0" y="0" width="760" height="48" rx="10" fill="#fff"/><text x="20" y="20" class="ct">01</text><text x="60" y="20" class="b">Choosing microservices before having boundary or scale need.</text><text x="60" y="38" class="s">Evidence first, extraction later.</text>
<rect x="0" y="58" width="760" height="48" rx="10" fill="#fff"/><text x="20" y="78" class="ct">02</text><text x="60" y="78" class="b">Drawing the context map from database tables instead of business language.</text><text x="60" y="96" class="s">The boundary belongs to the domain.</text>
<rect x="0" y="116" width="760" height="48" rx="10" fill="#fff"/><text x="20" y="136" class="ct">03</text><text x="60" y="136" class="b">Writing an ADR that shows the decision but hides rejected alternatives.</text><text x="60" y="154" class="s">An ADR must allow defending the "why".</text>
<rect x="0" y="174" width="760" height="48" rx="10" fill="#fff"/><text x="20" y="194" class="ct">04</text><text x="60" y="194" class="b">Creating stories without verifiable acceptance criteria.</text><text x="60" y="212" class="s">"Improve architecture" is not verifiable.</text>
</g>

<rect x="60" y="1630" width="1680" height="45" rx="14" fill="#0F2940"/>
<text x="900" y="1659" text-anchor="middle" class="flow">Refine backlog → Map contexts → Decide architecture → Record ADR → Create verifiable stories → Execute sprint</text>
</svg>