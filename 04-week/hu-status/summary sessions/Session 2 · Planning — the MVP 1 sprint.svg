<svg width="1920" height="1200" viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <g id="checkIcon">
      <circle r="16" fill="#16a34a"/>
      <path d="M-7,0 L-2,6 L8,-7" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="xIcon">
      <circle r="14" fill="#dc2626"/>
      <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1920" height="1200" fill="#f4f7fb"/>

  <!-- ================= HEADER ================= -->
  <text x="960" y="78" text-anchor="middle" font-size="46" font-weight="700" fill="#173a7a">Sprint Planning: MVP 1</text>
  <text x="960" y="115" text-anchor="middle" font-size="22" fill="#51607a">Contract-first &#183; small tasks &#183; protected scope &#183; a real "Done"</text>
  <rect x="1660" y="34" width="200" height="34" rx="17" fill="#e5edfb" stroke="#b9cdf0"/>
  <text x="1760" y="56" text-anchor="middle" font-size="15" fill="#2952a3" font-weight="600">Week 4 &#183; Session 2</text>

  <!-- ================= ROW 1 : 4 STEPS ================= -->
  <!-- connecting arrows -->
  <line x1="492" y1="305" x2="514" y2="305" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="948" y1="305" x2="970" y2="305" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1404" y1="305" x2="1426" y2="305" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- CARD 1 : contract-first -->
  <g>
    <rect x="60" y="155" width="432" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <circle cx="100" cy="197" r="24" fill="#dbe7fb"/>
    <text x="100" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#2952a3">1</text>
    <text x="136" y="203" font-size="23" font-weight="700" fill="#173a7a">Contract-first</text>
    <line x1="84" y1="228" x2="468" y2="228" stroke="#e7ecf3" stroke-width="2"/>
    <text x="84" y="256" font-size="17.5" fill="#33415c">
      <tspan x="84" dy="0">The API is defined BEFORE coding.</tspan>
      <tspan x="84" dy="25">OpenAPI/proto = the source of truth.</tspan>
      <tspan x="84" dy="25">Frontend &amp; backend work in parallel</tspan>
      <tspan x="84" dy="25">against the same promise.</tspan>
    </text>
    <rect x="84" y="358" width="384" height="76" rx="10" fill="#0f2942"/>
    <text x="98" y="380" font-family="'Courier New', monospace" font-size="13.5" fill="#a9d3ff">
      <tspan x="98" dy="0">POST /api/v1/orders</tspan>
      <tspan x="98" dy="19" fill="#8be0b0">201 &#8594; orderId, status: CONFIRMED</tspan>
      <tspan x="98" dy="19" fill="#ffb4a8">409 &#8594; error: OUT_OF_STOCK</tspan>
    </text>
  </g>

  <!-- CARD 2 : small tasks -->
  <g>
    <rect x="516" y="155" width="432" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <circle cx="556" cy="197" r="24" fill="#dbe7fb"/>
    <text x="556" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#2952a3">2</text>
    <text x="592" y="203" font-size="23" font-weight="700" fill="#173a7a">Small tasks</text>
    <line x1="540" y1="228" x2="924" y2="228" stroke="#e7ecf3" stroke-width="2"/>
    <text x="540" y="256" font-size="17.5" fill="#33415c">
      <tspan x="540" dy="0">The sprint is sliced into ~1-day</tspan>
      <tspan x="540" dy="25">tasks that can be verified, each</tspan>
      <tspan x="540" dy="25">tied to a user story with clear</tspan>
      <tspan x="540" dy="25">acceptance criteria.</tspan>
      <tspan x="540" dy="25" font-weight="600" fill="#173a7a">Big tasks hide risk;</tspan>
      <tspan x="540" dy="25" font-weight="600" fill="#173a7a">small tasks flow on the board.</tspan>
    </text>
    <text x="540" y="428" font-size="15" font-style="italic" fill="#7a879c">&#8595; board example below</text>
  </g>

  <!-- CARD 3 : estimate & protect scope -->
  <g>
    <rect x="972" y="155" width="432" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <circle cx="1012" cy="197" r="24" fill="#dbe7fb"/>
    <text x="1012" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#2952a3">3</text>
    <text x="1048" y="203" font-size="21.5" font-weight="700" fill="#173a7a">Estimate &amp; protect scope</text>
    <line x1="996" y1="228" x2="1380" y2="228" stroke="#e7ecf3" stroke-width="2"/>
    <text x="996" y="256" font-size="17.5" fill="#33415c">
      <tspan x="996" dy="0">Story points, not hours treated</tspan>
      <tspan x="996" dy="25">as a promise. MoSCoW prioritizes:</tspan>
      <tspan x="996" dy="25">Must / Should / Could / Won't.</tspan>
      <tspan x="996" dy="25">Only the Musts that fit get</tspan>
      <tspan x="996" dy="25" font-weight="600" fill="#173a7a">committed: the sprint goal is the</tspan>
      <tspan x="996" dy="25" font-weight="600" fill="#173a7a">shield against scope creep.</tspan>
    </text>
  </g>

  <!-- CARD 4 : Definition of Done -->
  <g>
    <rect x="1428" y="155" width="432" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <circle cx="1468" cy="197" r="24" fill="#dbe7fb"/>
    <text x="1468" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#2952a3">4</text>
    <text x="1504" y="203" font-size="23" font-weight="700" fill="#173a7a">Define "Done"</text>
    <line x1="1452" y1="228" x2="1836" y2="228" stroke="#e7ecf3" stroke-width="2"/>
    <text x="1452" y="256" font-size="17.5" fill="#33415c">
      <tspan x="1452" dy="0">Before coding, agree on what</tspan>
      <tspan x="1452" dy="25">"done" means, so nobody argues</tspan>
      <tspan x="1452" dy="25">about it at the demo.</tspan>
      <tspan x="1452" dy="25" font-weight="600" fill="#173a7a">"MVP" reduces scope, not</tspan>
      <tspan x="1452" dy="25" font-weight="600" fill="#173a7a">quality standards.</tspan>
    </text>
    <text x="1452" y="428" font-size="15" font-style="italic" fill="#7a879c">&#8595; full checklist below</text>
  </g>

  <!-- ================= ROW 2 LEFT : KANBAN EXAMPLE ================= -->
  <g>
    <rect x="60" y="470" width="885" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <text x="84" y="504" font-size="21" font-weight="700" fill="#173a7a">Example: task board</text>
    <text x="84" y="527" font-size="14.5" fill="#7a879c">US = user story &#183; each card is a ~1-day task</text>

    <!-- column: To Do -->
    <rect x="84" y="546" width="268" height="34" rx="6" fill="#64748b"/>
    <text x="218" y="569" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">TO DO</text>
    <rect x="84" y="590" width="268" height="46" rx="8" fill="#f4f6f9" stroke="#e1e6ee"/>
    <text x="94" y="618" font-size="14" fill="#33415c">US-01 Create Order aggregate</text>
    <rect x="84" y="644" width="268" height="46" rx="8" fill="#f4f6f9" stroke="#e1e6ee"/>
    <text x="94" y="672" font-size="14" fill="#33415c">US-03 GET /stock client</text>

    <!-- column: In Progress -->
    <rect x="368" y="546" width="268" height="34" rx="6" fill="#2563eb"/>
    <text x="502" y="569" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">IN PROGRESS</text>
    <rect x="368" y="590" width="268" height="46" rx="8" fill="#eef3ff" stroke="#c7d8fb"/>
    <text x="378" y="618" font-size="14" fill="#173a7a">US-04 Persist order</text>

    <!-- column: Done -->
    <rect x="652" y="546" width="268" height="34" rx="6" fill="#16a34a"/>
    <text x="786" y="569" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">DONE</text>
    <rect x="652" y="590" width="268" height="46" rx="8" fill="#eefaf1" stroke="#bfe8cb"/>
    <text x="662" y="618" font-size="14" fill="#175c34">US-02 POST /orders</text>
    <rect x="652" y="644" width="268" height="46" rx="8" fill="#eefaf1" stroke="#bfe8cb"/>
    <text x="662" y="672" font-size="14" fill="#175c34">US-00 Walking skeleton</text>

    <line x1="84" y1="712" x2="920" y2="712" stroke="#e7ecf3" stroke-width="2"/>
    <text x="84" y="742" font-size="16" font-style="italic" fill="#51607a">WIP limit: finish a task before starting another.</text>
  </g>

  <!-- ================= ROW 2 RIGHT : MOSCOW ================= -->
  <g>
    <rect x="975" y="470" width="885" height="300" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <text x="999" y="504" font-size="21" font-weight="700" fill="#173a7a">Priority: MoSCoW</text>

    <!-- Must -->
    <rect x="999" y="520" width="410" height="80" rx="10" fill="#eefaf1" stroke="#8fd6a4" stroke-width="2"/>
    <text x="1015" y="544" font-size="15.5" font-weight="700" fill="#166534">MUST (MVP 1)</text>
    <text x="1015" y="566" font-size="14.5" fill="#33415c">Customer places an order for</text>
    <text x="1015" y="584" font-size="14.5" fill="#33415c">an in-stock item</text>

    <!-- Should -->
    <rect x="1425" y="520" width="410" height="80" rx="10" fill="#eef3ff" stroke="#a9c4f7" stroke-width="2"/>
    <text x="1441" y="544" font-size="15.5" font-weight="700" fill="#1e3a8a">SHOULD</text>
    <text x="1441" y="566" font-size="14.5" fill="#33415c">Customer order history</text>

    <!-- Could -->
    <rect x="999" y="610" width="410" height="80" rx="10" fill="#fff6e9" stroke="#f0c785" stroke-width="2"/>
    <text x="1015" y="634" font-size="15.5" font-weight="700" fill="#9a5b0a">COULD</text>
    <text x="1015" y="656" font-size="14.5" fill="#33415c">Email notification on</text>
    <text x="1015" y="674" font-size="14.5" fill="#33415c">order confirmation</text>

    <!-- Won't -->
    <rect x="1425" y="610" width="410" height="80" rx="10" fill="#fdeeed" stroke="#eeb0aa" stroke-width="2"/>
    <text x="1441" y="634" font-size="15.5" font-weight="700" fill="#9d2c22">WON'T (for now)</text>
    <text x="1441" y="656" font-size="14.5" fill="#33415c">Discounts and payment</text>
    <text x="1441" y="674" font-size="14.5" fill="#33415c">gateway integration</text>

    <rect x="999" y="705" width="836" height="40" rx="8" fill="#2952a3"/>
    <text x="1417" y="731" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Sprint goal = the shield: only the Musts that fit get in</text>
  </g>

  <!-- ================= ROW 3 : DEFINITION OF DONE CHECKLIST ================= -->
  <g>
    <rect x="60" y="785" width="1800" height="140" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
    <text x="84" y="818" font-size="21" font-weight="700" fill="#173a7a">Definition of Done &#8212; checklist before the demo</text>

    <use href="#checkIcon" x="100" y="875"/>
    <text x="128" y="866" font-size="15.5" fill="#33415c">
      <tspan x="128" dy="0">Acceptance criteria</tspan>
      <tspan x="128" dy="20">met</tspan>
    </text>

    <use href="#checkIcon" x="464" y="875"/>
    <text x="492" y="866" font-size="15.5" fill="#33415c">
      <tspan x="492" dy="0">Unit + integration</tspan>
      <tspan x="492" dy="20">tests green</tspan>
    </text>

    <use href="#checkIcon" x="828" y="875"/>
    <text x="856" y="866" font-size="15.5" fill="#33415c">
      <tspan x="856" dy="0">Runs in a container</tspan>
      <tspan x="856" dy="20">against a real DB</tspan>
    </text>

    <use href="#checkIcon" x="1192" y="875"/>
    <text x="1220" y="866" font-size="15.5" fill="#33415c">
      <tspan x="1220" dy="0">Handles the happy path</tspan>
      <tspan x="1220" dy="20">and the key error (e.g. 409)</tspan>
    </text>

    <use href="#checkIcon" x="1556" y="875"/>
    <text x="1584" y="866" font-size="15.5" fill="#33415c">
      <tspan x="1584" dy="0">README / ADR</tspan>
      <tspan x="1584" dy="20">updated</tspan>
    </text>
  </g>

  <!-- ================= ROW 4 LEFT : CAUTION SCENARIO ================= -->
  <g>
    <rect x="60" y="940" width="885" height="200" rx="16" fill="#fff8ef" stroke="#f0c785" stroke-width="2"/>
    <rect x="60" y="940" width="10" height="200" rx="5" fill="#e08e2b"/>
    <polygon points="106,962 122,990 90,990" fill="#e08e2b"/>
    <text x="106" y="985" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">!</text>
    <text x="140" y="978" font-size="20.5" font-weight="700" fill="#9a5b0a">Real life: scope creep on day 3</text>
    <text x="90" y="1010" font-size="16" fill="#4a3418">
      <tspan x="90" dy="0">Someone says: "while we're at it, let's</tspan>
      <tspan x="90" dy="24">add discounts and a payments integration".</tspan>
      <tspan x="90" dy="24" font-weight="600">Accepting it silently = MVP 1 misses release.</tspan>
      <tspan x="90" dy="24">Right move: anything not in the sprint goal</tspan>
      <tspan x="90" dy="24">goes to the backlog (Should/Could), not into</tspan>
      <tspan x="90" dy="24">this sprint. Re-plan at the next planning.</tspan>
    </text>
  </g>

  <!-- ================= ROW 4 RIGHT : COMMON MISTAKES ================= -->
  <g>
    <rect x="975" y="940" width="885" height="200" rx="16" fill="#fdf3f2" stroke="#eeb0aa" stroke-width="2"/>
    <text x="999" y="978" font-size="20.5" font-weight="700" fill="#9d2c22">Common mistakes</text>

    <use href="#xIcon" x="1013" y="1002"/>
    <text x="1035" y="1007" font-size="15.5" fill="#4a1f1c">Coding before the contract exists &#8594; integration surprises</text>

    <use href="#xIcon" x="1013" y="1038"/>
    <text x="1035" y="1043" font-size="15.5" fill="#4a1f1c">Estimating in "hours" and treating them as promises</text>

    <use href="#xIcon" x="1013" y="1074"/>
    <text x="1035" y="1079" font-size="15.5" fill="#4a1f1c">Committing every Must+Should+Could &#8594; nothing finishes</text>

    <use href="#xIcon" x="1013" y="1110"/>
    <text x="1035" y="1115" font-size="15.5" fill="#4a1f1c">A vague Definition of Done &#8594; endless "is it done?" debates</text>
  </g>

  <!-- footer -->
  <text x="960" y="1178" text-anchor="middle" font-size="14" fill="#9aa5b8">Week 4 &#183; Session 2 &#8212; Sprint MVP 1 Planning: contract-first, small tasks, protected scope, a real "Done"</text>

</svg>
