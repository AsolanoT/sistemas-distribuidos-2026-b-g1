<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
<defs>
  <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#38bdf8"/></marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbbf24"/></marker>
  <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#34d399"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f97316"/></marker>
  <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#64748b"/></marker>
</defs>

<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .code { font-family: 'Consolas','Menlo','Courier New', monospace; }
  .panelTitle { fill:#f8fafc; font-size:23px; font-weight:700; }
  .panelSub { fill:#94a3b8; font-size:14.5px; }
  .body { fill:#cbd5e1; font-size:14px; }
  .small { fill:#e2e8f0; font-size:12px; }
</style>

<rect x="0" y="0" width="1920" height="1200" fill="#0b1220"/>

<!-- HEADER -->
<rect x="40" y="30" width="1840" height="120" rx="18" fill="#111a2e" stroke="#22314d" stroke-width="1.5"/>
<text x="70" y="80" font-size="42" font-weight="700" fill="#f8fafc">Docker Compose and Orchestration</text>
<text x="70" y="116" font-size="19" fill="#94a3b8">From one container to a distributed system: networks, dependencies, health checks, and environments</text>
<!-- decorative container stack icon -->
<g>
  <rect x="1745" y="98" width="90" height="26" rx="6" fill="#1b2740" stroke="#38bdf8" stroke-width="2"/>
  <rect x="1755" y="72" width="90" height="26" rx="6" fill="#1b2740" stroke="#34d399" stroke-width="2"/>
  <rect x="1765" y="46" width="90" height="26" rx="6" fill="#1b2740" stroke="#fbbf24" stroke-width="2"/>
</g>

<!-- OBJECTIVES ROW -->
<g>
  <rect x="55" y="160" width="430" height="70" rx="14" fill="#131c2e" stroke="#22314d"/>
  <circle cx="81" cy="195" r="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
  <text x="81" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">1</text>
  <text x="105" y="190" class="small">Compose a multi-service system</text>
  <text x="105" y="208" class="small">on a shared network</text>
</g>
<g>
  <rect x="515" y="160" width="430" height="70" rx="14" fill="#131c2e" stroke="#22314d"/>
  <circle cx="541" cy="195" r="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
  <text x="541" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">2</text>
  <text x="565" y="190" class="small">Order startup with</text>
  <text x="565" y="208" class="small">health checks and depends_on</text>
</g>
<g>
  <rect x="975" y="160" width="430" height="70" rx="14" fill="#131c2e" stroke="#22314d"/>
  <circle cx="1001" cy="195" r="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
  <text x="1001" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#34d399">3</text>
  <text x="1025" y="190" class="small">Externalize configuration</text>
  <text x="1025" y="208" class="small">per environment</text>
</g>
<g>
  <rect x="1435" y="160" width="430" height="70" rx="14" fill="#131c2e" stroke="#22314d"/>
  <circle cx="1461" cy="195" r="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/>
  <text x="1461" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#fb7185">4</text>
  <text x="1485" y="190" class="small">Understand what an</text>
  <text x="1485" y="208" class="small">orchestrator adds (and when)</text>
</g>

<!-- ================= ROW A ================= -->

<!-- PANEL A1: red / topología -->
<g>
  <rect x="40" y="250" width="592" height="320" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="40" y="258" width="6" height="304" rx="3" fill="#38bdf8"/>
  <text x="64" y="292" class="panelTitle">From One Container to a System</text>
  <text x="64" y="316" class="panelSub">Compose = services + shared network + image + env + volumes</text>

  <rect x="76" y="336" width="520" height="150" rx="14" fill="#0f1830" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="96" y="356" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">appnet — shared network (DNS by name)</text>

  <rect x="96" y="380" width="108" height="55" rx="8" fill="#1b2740" stroke="#475569"/>
  <text x="150" y="411" text-anchor="middle" font-size="12" fill="#e2e8f0">gateway</text>

  <rect x="219" y="380" width="108" height="55" rx="8" fill="#1b2740" stroke="#38bdf8"/>
  <text x="273" y="411" text-anchor="middle" font-size="11.5" fill="#e2e8f0">orders-api</text>

  <rect x="342" y="380" width="108" height="55" rx="8" fill="#1b2740" stroke="#38bdf8"/>
  <text x="396" y="411" text-anchor="middle" font-size="11" fill="#e2e8f0">inventory-api</text>

  <rect x="465" y="380" width="108" height="55" rx="8" fill="#1b2740" stroke="#475569"/>
  <text x="519" y="411" text-anchor="middle" font-size="12" fill="#e2e8f0">db</text>

  <path d="M273,435 C273,462 396,462 396,435" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <text x="335" y="470" text-anchor="middle" font-size="10.5" fill="#7dd3fc">orders-api → http://inventory-api:8080</text>

  <text x="64" y="512" class="body">Each service is reached by name (DNS) — no fixed IPs.</text>
  <text x="64" y="532" class="body">It's your local, reproducible copy of the production topology.</text>
</g>

<!-- PANEL A2: startup order -->
<g>
  <rect x="664" y="250" width="592" height="320" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="664" y="258" width="6" height="304" rx="3" fill="#fbbf24"/>
  <text x="688" y="292" class="panelTitle">Startup Order Is Not Readiness</text>
  <text x="688" y="316" class="panelSub">depends_on controls order, not availability</text>

  <rect x="688" y="350" width="120" height="70" rx="10" fill="#1b2740" stroke="#fbbf24"/>
  <text x="748" y="380" text-anchor="middle" font-size="12.5" fill="#e2e8f0">db</text>
  <text x="748" y="397" text-anchor="middle" font-size="12.5" fill="#e2e8f0">starting…</text>

  <path d="M808,385 L826,385" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="829" y="350" width="120" height="70" rx="10" fill="#1b2740" stroke="#fbbf24"/>
  <text x="889" y="380" text-anchor="middle" font-size="12.5" fill="#e2e8f0">healthcheck</text>
  <text x="889" y="397" text-anchor="middle" font-size="12.5" fill="#e2e8f0">pg_isready</text>

  <path d="M949,385 L967,385" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="970" y="350" width="120" height="70" rx="10" fill="#1b2740" stroke="#34d399"/>
  <text x="1030" y="380" text-anchor="middle" font-size="12.5" fill="#e2e8f0">db</text>
  <text x="1030" y="397" text-anchor="middle" font-size="12.5" fill="#34d399">healthy ✓</text>

  <path d="M1090,385 L1108,385" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="1111" y="350" width="120" height="70" rx="10" fill="#1b2740" stroke="#fbbf24"/>
  <text x="1171" y="380" text-anchor="middle" font-size="12.5" fill="#e2e8f0">orders-api</text>
  <text x="1171" y="397" text-anchor="middle" font-size="12.5" fill="#e2e8f0">starts</text>

  <rect x="688" y="440" width="544" height="60" rx="10" fill="#241a0c" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="706" y="465" font-size="20" fill="#fbbf24">⚠</text>
  <text x="736" y="463" font-size="13.5" fill="#fde68a">"Started" ≠ "ready": never assume the</text>
  <text x="736" y="481" font-size="13.5" fill="#fde68a">database is already accepting connections.</text>

  <text x="688" y="522" class="body">Fix: healthcheck + depends_on: condition: service_healthy,</text>
  <text x="688" y="542" class="body">plus retries with backoff on service boot.</text>
</g>

<!-- PANEL A3: compose anatomy -->
<g>
  <rect x="1288" y="250" width="592" height="320" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="1288" y="258" width="6" height="304" rx="3" fill="#a78bfa"/>
  <text x="1312" y="292" class="panelTitle">Anatomy of a compose.yml</text>
  <text x="1312" y="316" class="panelSub">Same building blocks, always: services, network, config, health</text>

  <g class="code" font-size="13.5" fill="#cbd5e1">
    <text x="1312" y="340">services:</text>
    <text x="1312" y="358">  orders-api:</text>
    <text x="1312" y="376">    environment:</text>
    <text x="1312" y="394">      DB_URL: postgres://db:5432/orders <tspan fill="#4ade80">  # config via env</tspan></text>
    <text x="1312" y="412">    depends_on:</text>
    <text x="1312" y="430">      db: {condition: service_healthy} <tspan fill="#4ade80"># wait for healthy DB</tspan></text>
    <text x="1312" y="448">  db:</text>
    <text x="1312" y="466">    image: postgres:16</text>
    <text x="1312" y="484">    healthcheck:</text>
    <text x="1312" y="502">      test: pg_isready -U postgres <tspan fill="#4ade80"># defines "healthy"</tspan></text>
    <text x="1312" y="520">    volumes:</text>
    <text x="1312" y="538">      - dbdata:/var/lib/postgresql/data <tspan fill="#4ade80"># data persists</tspan></text>
  </g>
</g>

<!-- ================= ROW B ================= -->

<!-- PANEL B1: entornos -->
<g>
  <rect x="40" y="590" width="592" height="260" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="40" y="598" width="6" height="244" rx="3" fill="#34d399"/>
  <text x="64" y="632" class="panelTitle">One Base File, Many Environments</text>
  <text x="64" y="656" class="panelSub">Same compose.yml, a different override per environment</text>

  <rect x="226" y="676" width="220" height="50" rx="10" fill="#1b2740" stroke="#34d399"/>
  <text x="336" y="706" text-anchor="middle" font-size="13.5" fill="#e2e8f0">compose.yml (base)</text>

  <path d="M300,726 L200,748" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>
  <path d="M372,726 L472,748" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>

  <rect x="80" y="750" width="220" height="60" rx="10" fill="#1b2740" stroke="#475569"/>
  <text x="190" y="772" text-anchor="middle" font-size="12" fill="#e2e8f0">docker-compose.override.yml</text>
  <text x="190" y="790" text-anchor="middle" font-size="11.5" fill="#94a3b8">dev: hot-reload, low resources</text>

  <rect x="372" y="750" width="220" height="60" rx="10" fill="#1b2740" stroke="#475569"/>
  <text x="482" y="772" text-anchor="middle" font-size="12" fill="#e2e8f0">compose.prod.yml</text>
  <text x="482" y="790" text-anchor="middle" font-size="11.5" fill="#94a3b8">prod: replicas, resource limits</text>

  <text x="64" y="832" class="body">Secrets: via env vars or a secret store — never baked into images.</text>
</g>

<!-- PANEL B2: orquestadores -->
<g>
  <rect x="664" y="590" width="1216" height="260" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="664" y="598" width="6" height="244" rx="3" fill="#fb7185"/>
  <text x="688" y="632" class="panelTitle">When Compose Isn't Enough: Enter an Orchestrator</text>
  <text x="688" y="656" class="panelSub">Same mental model — services, networks, config, health — at cluster scale</text>

  <rect x="688" y="680" width="560" height="140" rx="12" fill="#1b2740" stroke="#475569"/>
  <text x="712" y="710" font-size="18" font-weight="700" fill="#e2e8f0">Docker Compose</text>
  <text x="712" y="736" class="body">• A single host</text>
  <text x="712" y="758" class="body">• Great for local/dev and small deployments</text>
  <text x="712" y="780" class="body">• If something fails, restarting is usually manual</text>

  <rect x="1296" y="680" width="560" height="140" rx="12" fill="#2a1620" stroke="#fb7185"/>
  <text x="1320" y="710" font-size="18" font-weight="700" fill="#e2e8f0">Orchestrator (e.g., Kubernetes)</text>
  <text x="1320" y="736" class="body">• Many hosts (a cluster)</text>
  <text x="1320" y="758" class="body">• Self-healing: restarts failed containers</text>
  <text x="1320" y="780" class="body">• Rolling updates and autoscaling</text>
</g>

<!-- ================= ROW C: caso real ================= -->
<g>
  <rect x="40" y="870" width="1840" height="150" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="40" y="878" width="6" height="134" rx="3" fill="#f97316"/>
  <text x="64" y="902" class="panelTitle">Real Case: "The API Crashes on Up!"</text>

  <rect x="91" y="930" width="330" height="70" rx="10" fill="#132a20" stroke="#34d399"/>
  <text x="256" y="955" text-anchor="middle" font-size="13" fill="#e2e8f0">Manual: you start the DB</text>
  <text x="256" y="973" text-anchor="middle" font-size="13" fill="#e2e8f0">first → it works ✓</text>

  <path d="M421,965 L441,965" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <rect x="443" y="930" width="330" height="70" rx="10" fill="#2a1620" stroke="#fb7185"/>
  <text x="608" y="955" text-anchor="middle" font-size="13" fill="#e2e8f0">In CI: docker compose up</text>
  <text x="608" y="973" text-anchor="middle" font-size="13" fill="#e2e8f0">→ orders-api fails ✗</text>

  <path d="M773,965 L793,965" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="795" y="930" width="330" height="70" rx="10" fill="#1b2740" stroke="#475569"/>
  <text x="960" y="955" text-anchor="middle" font-size="13" fill="#e2e8f0">Cause: it connects before</text>
  <text x="960" y="973" text-anchor="middle" font-size="13" fill="#e2e8f0">Postgres finishes initializing</text>

  <path d="M1125,965 L1145,965" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="1147" y="930" width="330" height="70" rx="10" fill="#241a0c" stroke="#fbbf24"/>
  <text x="1312" y="955" text-anchor="middle" font-size="13" fill="#e2e8f0">Fix: healthcheck + depends_on</text>
  <text x="1312" y="973" text-anchor="middle" font-size="13" fill="#e2e8f0">service_healthy + retry</text>

  <path d="M1477,965 L1497,965" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <rect x="1499" y="930" width="330" height="70" rx="10" fill="#132a20" stroke="#34d399"/>
  <text x="1664" y="955" text-anchor="middle" font-size="13" fill="#e2e8f0">Result: deterministic up</text>
  <text x="1664" y="973" text-anchor="middle" font-size="13" fill="#e2e8f0">✓ ready for CI / MVP</text>
</g>

<!-- ================= ROW D: errores comunes ================= -->
<g>
  <rect x="40" y="1040" width="1840" height="135" rx="16" fill="#131c2e" stroke="#22314d"/>
  <rect x="40" y="1048" width="6" height="119" rx="3" fill="#f87171"/>
  <text x="64" y="1072" class="panelTitle">Common Mistakes to Avoid</text>

  <circle cx="80" cy="1128" r="16" fill="#2a1620" stroke="#f87171" stroke-width="1.5"/>
  <text x="80" y="1133" text-anchor="middle" font-size="14" fill="#f87171">✗</text>
  <text x="108" y="1118" class="body">Relying only on depends_on</text>
  <text x="108" y="1138" class="body">(order ≠ availability)</text>

  <circle cx="531" cy="1128" r="16" fill="#2a1620" stroke="#f87171" stroke-width="1.5"/>
  <text x="531" y="1133" text-anchor="middle" font-size="14" fill="#f87171">✗</text>
  <text x="559" y="1118" class="body">Hardcoded hostnames/IPs instead</text>
  <text x="559" y="1138" class="body">of the service name</text>

  <circle cx="982" cy="1128" r="16" fill="#2a1620" stroke="#f87171" stroke-width="1.5"/>
  <text x="982" y="1133" text-anchor="middle" font-size="14" fill="#f87171">✗</text>
  <text x="1010" y="1118" class="body">Committing secrets or</text>
  <text x="1010" y="1138" class="body">baking env into the image</text>

  <circle cx="1433" cy="1128" r="16" fill="#2a1620" stroke="#f87171" stroke-width="1.5"/>
  <text x="1433" y="1133" text-anchor="middle" font-size="14" fill="#f87171">✗</text>
  <text x="1461" y="1118" class="body">DB data outside a</text>
  <text x="1461" y="1138" class="body">volume (lost on down)</text>
</g>

</svg>
