<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333EA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1200" fill="#F8FAFC"/>

  <!-- TITLE -->
  <text x="60" y="112" font-size="42" font-weight="700" fill="#0F172A">Inter-Service Communication</text>
  <text x="60" y="142" font-size="19" fill="#475569">REST, gRPC and Messaging — how microservices talk to each other</text>
  <rect x="1630" y="70" width="230" height="40" rx="20" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="1745" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#4338CA">WEEK 7 · SESSION 1</text>
  <line x1="60" y1="158" x2="1860" y2="158" stroke="#CBD5E1" stroke-width="2"/>

  <!-- ROW A: SYNC -->
  <rect x="60" y="168" width="880" height="230" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="90" y="200" font-size="24" font-weight="700" fill="#2563EB">1 · SYNCHRONOUS — the caller waits</text>

  <rect x="100" y="230" width="140" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="170" y="265" text-anchor="middle" font-size="16" fill="#1E3A8A">Orders</text>
  <rect x="700" y="230" width="140" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="770" y="265" text-anchor="middle" font-size="16" fill="#1E3A8A">Inventory</text>

  <line x1="240" y1="255" x2="698" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="245" text-anchor="middle" font-size="14" fill="#1E3A8A">GET /stock</text>
  <line x1="700" y1="282" x2="242" y2="282" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="470" y="302" text-anchor="middle" font-size="14" fill="#1E3A8A">200 OK (waiting)</text>

  <text x="100" y="344" font-size="15" fill="#334155">• The caller blocks until it gets a response.</text>
  <text x="100" y="364" font-size="15" fill="#334155">• Simple to reason about, but couples in time.</text>
  <text x="100" y="384" font-size="15" fill="#334155">• If Inventory is slow or down, Orders suffers.</text>

  <!-- ROW A: ASYNC -->
  <rect x="980" y="168" width="880" height="230" rx="14" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1010" y="200" font-size="24" font-weight="700" fill="#EA580C">2 · ASYNCHRONOUS — the caller moves on</text>

  <rect x="1010" y="230" width="120" height="60" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="1070" y="265" text-anchor="middle" font-size="16" fill="#9A3412">Orders</text>
  <rect x="1370" y="230" width="140" height="60" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="1440" y="265" text-anchor="middle" font-size="16" fill="#9A3412">Broker</text>
  <rect x="1690" y="230" width="120" height="60" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="1750" y="265" text-anchor="middle" font-size="16" fill="#9A3412">Inventory</text>

  <line x1="1130" y1="255" x2="1368" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1250" y="245" text-anchor="middle" font-size="14" fill="#9A3412">OrderPlaced</text>
  <line x1="1510" y1="255" x2="1688" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1600" y="245" text-anchor="middle" font-size="14" fill="#9A3412">delivers</text>

  <text x="1010" y="344" font-size="15" fill="#334155">• The caller publishes the event and continues.</text>
  <text x="1010" y="364" font-size="15" fill="#334155">• Decouples and absorbs load spikes.</text>
  <text x="1010" y="384" font-size="15" fill="#334155">• At the cost of eventual consistency.</text>

  <!-- ROW B: REST -->
  <rect x="60" y="414" width="580" height="240" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="90" y="446" font-size="22" font-weight="700" fill="#2563EB">REST — the default synchronous choice</text>
  <text x="90" y="474" font-size="15" fill="#334155">• JSON over HTTP: readable, great tooling</text>
  <text x="90" y="498" font-size="15" fill="#334155">• Great for public APIs and service-to-service calls</text>
  <text x="90" y="522" font-size="15" fill="#334155">• Contract enforced via OpenAPI (not built-in)</text>
  <text x="90" y="546" font-size="15" fill="#334155">• Weak spot: verbose payloads, one request at a time</text>
  <rect x="90" y="595" width="460" height="36" rx="6" fill="#EFF6FF"/>
  <text x="102" y="618" font-size="13" font-style="italic" fill="#1E3A8A">Example: GET /orders/123  →  200 OK</text>

  <!-- ROW B: gRPC -->
  <rect x="670" y="414" width="580" height="240" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="700" y="446" font-size="22" font-weight="700" fill="#15803D">gRPC — synchronous, fast, contract-first</text>
  <text x="700" y="474" font-size="15" fill="#334155">• .proto contract → typed client &amp; server</text>
  <text x="700" y="496" font-size="15" fill="#334155">• Binary over HTTP/2, supports streaming</text>
  <text x="700" y="518" font-size="15" fill="#334155">• Great for internal, high-throughput calls</text>
  <rect x="700" y="532" width="520" height="70" rx="6" fill="#0F172A"/>
  <text x="714" y="552" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#86EFAC">service Inventory {</text>
  <text x="714" y="570" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#86EFAC">  rpc CheckStock(Req) returns (Reply);</text>
  <text x="714" y="588" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#86EFAC">}</text>
  <text x="700" y="618" font-size="14" fill="#334155">• Weak spot: not human-readable, needs tooling</text>

  <!-- ROW B: Messaging -->
  <rect x="1280" y="414" width="580" height="240" rx="12" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
  <text x="1310" y="446" font-size="22" font-weight="700" fill="#7E22CE">Messaging — the async backbone</text>
  <text x="1310" y="474" font-size="15" fill="#334155">• A broker (Kafka, RabbitMQ) links producers &amp; consumers</text>
  <text x="1310" y="498" font-size="15" fill="#334155">• Queues: distribute work across N workers</text>
  <text x="1310" y="522" font-size="15" fill="#334155">• Pub/Sub: one event fans out to many subscribers</text>
  <text x="1310" y="546" font-size="15" fill="#334155">• E.g.: OrderPlaced → Inventory, Shipping, Analytics</text>
  <text x="1310" y="570" font-size="15" fill="#334155">• Producers don't know who the consumers are</text>

  <rect x="1360" y="592" width="180" height="32" rx="6" fill="#F5F3FF" stroke="#9333EA" stroke-width="1.5"/>
  <text x="1450" y="613" text-anchor="middle" font-size="12" fill="#6B21A8">topic: OrderPlaced</text>
  <line x1="1450" y1="624" x2="1360" y2="636" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="1450" y1="624" x2="1500" y2="636" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="1450" y1="624" x2="1640" y2="636" stroke="#9333EA" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <rect x="1305" y="636" width="110" height="30" rx="6" fill="#FAF5FF" stroke="#C4B5FD"/>
  <text x="1360" y="656" text-anchor="middle" font-size="11" fill="#4C1D95">Inventory</text>
  <rect x="1445" y="636" width="110" height="30" rx="6" fill="#FAF5FF" stroke="#C4B5FD"/>
  <text x="1500" y="656" text-anchor="middle" font-size="11" fill="#4C1D95">Shipping</text>
  <rect x="1585" y="636" width="110" height="30" rx="6" fill="#FAF5FF" stroke="#C4B5FD"/>
  <text x="1640" y="656" text-anchor="middle" font-size="11" fill="#4C1D95">Analytics</text>

  <!-- ROW C: Delivery semantics -->
  <rect x="60" y="670" width="1000" height="180" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="90" y="702" font-size="22" font-weight="700" fill="#DC2626">3 · Delivery semantics — networks lose and duplicate</text>

  <rect x="90" y="724" width="290" height="64" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="102" y="748" font-size="13" font-weight="700" fill="#991B1B">At-most-once</text>
  <text x="102" y="768" font-size="12" fill="#7F1D1D">may lose data</text>

  <rect x="395" y="724" width="290" height="64" rx="6" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="407" y="748" font-size="13" font-weight="700" fill="#92400E">At-least-once</text>
  <text x="407" y="768" font-size="12" fill="#92400E">duplicates (typical broker default)</text>

  <rect x="700" y="724" width="290" height="64" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="712" y="748" font-size="13" font-weight="700" fill="#6B21A8">Exactly-once end-to-end</text>
  <text x="712" y="768" font-size="12" fill="#6B21A8">does not exist</text>

  <text x="90" y="812" font-size="15" font-style="italic" fill="#334155">You engineer exactly-once processing = at-least-once + an idempotency key + dedup.</text>

  <!-- ROW C: Idempotent consumer -->
  <rect x="1100" y="670" width="760" height="180" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="1130" y="702" font-size="20" font-weight="700" fill="#0F172A">Idempotent Consumer (Go)</text>
  <rect x="1130" y="712" width="700" height="128" rx="6" fill="#0F172A"/>
  <text x="1145" y="736" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#E2E8F0">func Handle(ev Event) error {</text>
  <text x="1145" y="756" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#E2E8F0">  if seen(ev.ID) { return nil }<tspan fill="#86EFAC">  // duplicate, ignore</tspan></text>
  <text x="1145" y="776" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#E2E8F0">  if err := apply(ev); err != nil { return err }</text>
  <text x="1145" y="796" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#E2E8F0">  return mark(ev.ID)<tspan fill="#86EFAC">  // retries are no-ops</tspan></text>
  <text x="1145" y="816" font-size="13" font-family="'Consolas','Menlo',monospace" fill="#E2E8F0">}</text>

  <!-- ROW D: decision guide -->
  <rect x="60" y="866" width="880" height="180" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="90" y="898" font-size="22" font-weight="700" fill="#4338CA">4 · When to use which?</text>
  <text x="90" y="926" font-size="15" fill="#334155">Need an answer right now?  →  Synchronous (REST / gRPC)</text>
  <text x="90" y="952" font-size="15" fill="#334155">Must survive the callee being down?  →  Asynchronous (events)</text>
  <text x="90" y="978" font-size="15" fill="#334155">Many consumers of one fact?  →  Asynchronous (events)</text>
  <text x="90" y="1004" font-size="15" fill="#334155">Internal &amp; high-throughput? → gRPC   |   Public / browser-facing? → REST</text>

  <!-- ROW D: scenario -->
  <rect x="980" y="866" width="880" height="180" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="1010" y="898" font-size="22" font-weight="700" fill="#DC2626">Real-world case: the chain that cascades</text>
  <text x="1010" y="924" font-size="15" fill="#334155">Checkout → Payments → Fraud   (all synchronous; Fraud is slow)</text>
  <text x="1010" y="948" font-size="14" fill="#7F1D1D">• Under load, threads pile up and the pool exhausts</text>
  <text x="1010" y="970" font-size="14" fill="#7F1D1D">• The whole checkout freezes</text>
  <text x="1010" y="1000" font-size="14" font-weight="700" fill="#166534">Fix: make the non-critical step async + timeout/circuit breaker + show “payment pending”.</text>

  <!-- FOOTER: common mistakes -->
  <text x="60" y="1080" font-size="20" font-weight="700" fill="#991B1B">Common Mistakes</text>

  <rect x="60" y="1086" width="420" height="54" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="82" cy="1113" r="12" fill="#DC2626"/>
  <text x="82" y="1118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">✕</text>
  <text x="104" y="1118" font-size="12.5" fill="#7F1D1D">Long synchronous chains that collapse under load</text>

  <rect x="520" y="1086" width="420" height="54" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="542" cy="1113" r="12" fill="#DC2626"/>
  <text x="542" y="1118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">✕</text>
  <text x="564" y="1118" font-size="12.5" fill="#7F1D1D">Assuming exactly-once instead of idempotency</text>

  <rect x="980" y="1086" width="420" height="54" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="1002" cy="1113" r="12" fill="#DC2626"/>
  <text x="1002" y="1118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">✕</text>
  <text x="1024" y="1118" font-size="12.5" fill="#7F1D1D">Using events when an immediate answer is needed</text>

  <rect x="1440" y="1086" width="420" height="54" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="1462" cy="1113" r="12" fill="#DC2626"/>
  <text x="1462" y="1118" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">✕</text>
  <text x="1484" y="1118" font-size="12.5" fill="#7F1D1D">Skipping timeout / retry / circuit breaker</text>

</svg>
