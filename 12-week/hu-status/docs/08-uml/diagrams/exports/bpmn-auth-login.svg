<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="title desc"><title id="title">BPMN — Real Auth Login</title><desc id="desc">Auth portal collects; Host owns authentication/session; Gateway limits/presence routing; Auth issues credentials. Source SHA-256: 4048d8dc96ef5e9ec0d0e7df627b6aa8661939959ba4656bf6d3f320bcc9638b</desc><metadata id="drawio-source-sha256">4048d8dc96ef5e9ec0d0e7df627b6aa8661939959ba4656bf6d3f320bcc9638b</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#405979"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172b45">BPMN — Real Auth Login</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#405979">Auth portal collects; Host owns authentication/session; Gateway limits/presence routing; Auth issues credentials</text><g id="node-browser"><g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"><rect x="40" y="115" width="1620" height="220" rx="0"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start"><tspan x="55" y="137">Browser: Auth portal and Host capability</tspan></text></g><g id="node-authlane"><g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"><rect x="40" y="365" width="1620" height="390" rx="0"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start"><tspan x="55" y="387">Gateway / Auth API: separate transport and identity responsibilities</tspan></text></g><g id="edge-0"><polyline points="128,219 190,225" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-1"><polyline points="470,225 550,225" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-2"><polyline points="715,280 715,350 640,350 640,420" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="677.5" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Public login; no prior JWT</text></g><g id="edge-3"><polyline points="800,490 890,497.5" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-4"><polyline points="1100,497.5 1190,480" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1145" y="480.75" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Yes</text></g><g id="edge-5"><polyline points="995,575 995,602.5 1070,602.5 1070,630" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1032.5" y="594.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">No / unavailable</text></g><g id="node-start"><g fill="#e8efff" stroke="#405979" stroke-width="2"><ellipse cx="99" cy="219" rx="29" ry="29"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle"><tspan x="99" y="225">Start</tspan></text></g><g id="node-form"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="190" y="170" width="280" height="110" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="330" y="220.5">Auth Login form</tspan><tspan x="330" y="241.5">Email/password, pending/errors</tspan></text></g><g id="node-host"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="550" y="170" width="330" height="110" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="715" y="220.5">Host public authentication transport</tspan><tspan x="715" y="241.5">No portal token owner</tspan></text></g><g id="node-limit"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="480" y="420" width="320" height="140" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="640" y="475">Gateway login rate limit</tspan><tspan x="640" y="496">Auth validates active user</tspan><tspan x="640" y="517">and bcrypt credentials</tspan></text></g><g id="node-valid"><g fill="#fff2cc" stroke="#405979" stroke-width="2"><polygon points="995,420 1100,497.5 995,575 890,497.5"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="995" y="493">Credentials</tspan><tspan x="995" y="514">valid?</tspan></text></g><g id="node-issue"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="1190" y="410" width="340" height="140" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="1360" y="465">Auth issues RS256 + refresh</tspan><tspan x="1360" y="486">Host stores credentials/session</tspan><tspan x="1360" y="507">Return allowed local route</tspan></text></g><g id="node-error"><g fill="#fff7ed" stroke="#405979" stroke-width="2"><rect x="720" y="630" width="700" height="95" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="1070" y="662.5">Generic rejection / service error</tspan><tspan x="1070" y="683.5">No account disclosure, refresh or automatic login retry</tspan><tspan x="1070" y="704.5">No session established</tspan></text></g><g id="node-note"><g fill="#fff7ed" stroke="#405979" stroke-width="2"><rect x="80" y="805" width="1540" height="95" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="850" y="858.5">Real Login is delivered. /users and /service-tokens are placeholder UI. ADR-016 coordinates Host renewal; ADR-017 bounds issued-JWT revocation. Initial ADMIN CLI is outside this flow.</tspan></text></g><text x="40" y="930" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#536579">SynkroTech · HU-DOCS-97 · 2026-10-25 · source/export paired; diagram is not execution evidence</text></svg>
