<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1120" viewBox="0 0 1950 1120" role="img" aria-labelledby="title desc"><title id="title">BPMN — Sale registration and uncertain recovery</title><desc id="desc">Accepted ADR-015/016 · one original intent identity · no blanket 4xx compensation or automatic restart promise. Source SHA-256: ff9a4a4c7b12d549002262f9d53b318c7fa0a32fc67139d926880a4006264d74</desc><metadata id="drawio-source-sha256">ff9a4a4c7b12d549002262f9d53b318c7fa0a32fc67139d926880a4006264d74</metadata><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#405979"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172b45">BPMN — Sale registration and uncertain recovery</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#405979">Accepted ADR-015/016 · one original intent identity · no blanket 4xx compensation or automatic restart promise</text><g id="node-uilane"><g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"><rect x="40" y="115" width="1870" height="210" rx="0"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start"><tspan x="55" y="137">Browser: Sales Portal uses Host session/client; owns per-tab journal and bounded observation</tspan></text></g><g id="node-sagalane"><g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"><rect x="40" y="355" width="1870" height="340" rx="0"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start"><tspan x="55" y="377">Workflow: person authority at entry, SERVICE authority to real participants, own durable store</tspan></text></g><g id="node-resultlane"><g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"><rect x="40" y="735" width="1870" height="240" rx="0"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="start"><tspan x="55" y="757">Evidence/outcome handling — each projection has a distinct UI/operational consequence</tspan></text></g><g id="edge-0"><polyline points="520,225 650,225" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-1"><polyline points="875,285 875,352.5 260,352.5 260,420" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="567.5" y="344.5" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Original person/key/input</text></g><g id="edge-2"><polyline points="430,482.5 500,482.5" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-3"><polyline points="850,482.5 920,482.5" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="885" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Step 3</text></g><g id="edge-4"><polyline points="1270,482.5 1370,482.5" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/></g><g id="edge-5"><polyline points="1600,482 1810,482 1810,750 1585,750 1585,805" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1740" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Confirmed receipt</text></g><g id="edge-6"><polyline points="1427.5,526.25 1290,600 1290,765 1020,765 1020,800" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1370" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Proven rejection</text></g><g id="edge-7"><polyline points="1485,570 1485,635 850,635" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1485" y="627" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Unknown / invalid evidence</text></g><g id="edge-8"><polyline points="675,545 675,575 1220,575 1220,720 840,720 840,800" fill="none" stroke="#405979" stroke-width="2"  marker-end="url(#arrow)"/><text x="1120" y="705" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172b45" stroke="white" stroke-width="5" paint-order="stroke">Proven pre-sale rejection</text></g><g id="node-input"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="90" y="165" width="430" height="120" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="305" y="210">Select Customer + Product IDs/qty</tspan><tspan x="305" y="231">Preview only; persist original key,</tspan><tspan x="305" y="252">fingerprint and 24h deadline</tspan></text></g><g id="node-post"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="650" y="165" width="450" height="120" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="875" y="210">Explicit POST /sagas/register-sale</tspan><tspan x="875" y="231">No automatic POST retry</tspan><tspan x="875" y="252">RUNNING -&gt; bounded observation</tspan></text></g><g id="node-replay"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="90" y="420" width="340" height="125" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="260" y="478">Validate caller/input replay</tspan><tspan x="260" y="499">Persist state/attempt identity</tspan></text></g><g id="node-reserve"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="500" y="420" width="350" height="125" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="675" y="467.5">1 validate Customer</tspan><tspan x="675" y="488.5">2 reserve all stock atomically</tspan><tspan x="675" y="509.5">Freeze prices in Products</tspan></text></g><g id="node-register"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="920" y="420" width="350" height="125" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="1095" y="467.5">3 register Sale in Sales</tspan><tspan x="1095" y="488.5">Frozen prices + createdBy</tspan><tspan x="1095" y="509.5">Sales computes integer totals</tspan></text></g><g id="node-evidence"><g fill="#fff2cc" stroke="#405979" stroke-width="2"><polygon points="1485,395 1600,482.5 1485,570 1370,482.5"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="1485" y="478">Validated</tspan><tspan x="1485" y="499">outcome?</tspan></text></g><g id="node-complete"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="1370" y="805" width="430" height="120" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="1585" y="850">COMPLETED + saleId</tspan><tspan x="1585" y="871">Load authoritative Sale/history</tspan><tspan x="1585" y="892">Metadata failure keeps IDs/amounts</tspan></text></g><g id="node-compensate"><g fill="#e8efff" stroke="#405979" stroke-width="2"><rect x="500" y="800" width="680" height="130" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="840" y="850">Proven permitted rejection</tspan><tspan x="840" y="871">Release only an existing reservation</tspan><tspan x="840" y="892">COMPENSATED, or FAILED if release cannot complete</tspan></text></g><g id="node-hold"><g fill="#fff7ed" stroke="#405979" stroke-width="2"><rect x="90" y="590" width="760" height="90" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="470" y="620">Ambiguous / possibly committed</tspan><tspan x="470" y="641">Retain stock and original identity</tspan><tspan x="470" y="662">RUNNING/suspended or attention; reconcile</tspan></text></g><g id="node-note"><g fill="#fff7ed" stroke="#405979" stroke-width="2"><rect x="80" y="1000" width="1790" height="90" rx="12"/></g><text fill="#172b45" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle"><tspan x="975" y="1040.5">Unresolved is a browser observation state, not proof of backend failure. Reload does not auto-POST/GET; explicit same-key recovery only. Logout/abort does not cancel or compensate a saga. FAILED requires attention; no fresh key</tspan><tspan x="975" y="1061.5">to conceal uncertainty.</tspan></text></g><text x="40" y="1100" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#536579">SynkroTech · HU-DOCS-97 · 2026-10-25 · source/export paired; diagram is not execution evidence</text></svg>
