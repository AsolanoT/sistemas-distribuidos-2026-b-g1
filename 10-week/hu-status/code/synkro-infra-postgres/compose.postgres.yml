# Preparation only. Full platform composition is compose.yml.
services:
  synkro-db:
    image: postgres:16.15-alpine3.23
    entrypoint: [sh, /usr/local/bin/synkro-entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_DB: synkro
      POSTGRES_USER: ${DB_ADMIN_USER:?set DB_ADMIN_USER}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      AUTH_APP_PASSWORD_FILE: /run/secrets/postgres_auth_password
      CUSTOMERS_APP_PASSWORD_FILE: /run/secrets/postgres_customers_password
      PRODUCTS_APP_PASSWORD_FILE: /run/secrets/postgres_products_password
      WORKFLOW_APP_PASSWORD_FILE: /run/secrets/postgres_workflow_password
    secrets:
      - postgres_admin_password
      - postgres_auth_password
      - postgres_customers_password
      - postgres_products_password
      - postgres_workflow_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./postgres/entrypoint.sh
        target: /usr/local/bin/synkro-entrypoint.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./postgres/health.sh
        target: /usr/local/bin/synkro-health.sh
        read_only: true
        bind: {create_host_path: false}
    expose: ["5432"]
    tmpfs:
      - /run/synkro-postgres-secrets:mode=0700
    healthcheck:
      test: [CMD-SHELL, 'sh /usr/local/bin/synkro-health.sh']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [platform]
    restart: unless-stopped
volumes:
  postgres-data:
networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-platform}
secrets:
  postgres_admin_password:
    file: ${DB_ADMIN_PASSWORD_PATH:?set DB_ADMIN_PASSWORD_PATH}
  postgres_auth_password:
    file: ${AUTH_APP_PASSWORD_PATH:?set AUTH_APP_PASSWORD_PATH}
  postgres_customers_password:
    file: ${CUSTOMERS_APP_PASSWORD_PATH:?set CUSTOMERS_APP_PASSWORD_PATH}
  postgres_products_password:
    file: ${PRODUCTS_APP_PASSWORD_PATH:?set PRODUCTS_APP_PASSWORD_PATH}
  postgres_workflow_password:
    file: ${WORKFLOW_APP_PASSWORD_PATH:?set WORKFLOW_APP_PASSWORD_PATH}
