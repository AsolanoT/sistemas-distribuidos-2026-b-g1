services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    expose: ["4317", "4318", "8889", "13133"]
    networks: [platform]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_password]
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]
volumes:
  prometheus-data:
  grafana-data:
secrets:
  grafana_password:
    file: ${GRAFANA_ADMIN_PASSWORD_PATH:?set GRAFANA_ADMIN_PASSWORD_PATH}
networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-platform}
