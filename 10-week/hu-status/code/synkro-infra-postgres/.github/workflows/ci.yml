name: ci

on:
  push:
    branches: [develop, qa, main, feat/postgres-bootstrap-and-root-composition]
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  check-common-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          python scripts/verify_protected.py --primary-only
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Bash syntax and ShellCheck
        run: |
          set -euo pipefail
          for file in scripts/*.sh postgres/init/*.sh postgres/*.sh; do bash -n "$file"; done
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.10.0 scripts/*.sh postgres/init/*.sh postgres/*.sh
      - name: Guard protected governance and historical ownership
        run: |
          set -euo pipefail
          git diff --check
          test -f .github/CODEOWNERS
