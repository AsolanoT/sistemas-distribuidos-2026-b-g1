name: private-integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-engines-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Approved private read access for explicitly dispatched integration only.
      SYNKRO_DEPENDENCY_READ_TOKEN: ${{ secrets.SYNKRO_DEPENDENCY_READ_TOKEN }}
    steps:
      - name: Require explicitly approved private dependency access
        env:
          SYNKRO_DEPENDENCY_READ_TOKEN: ${{ secrets.SYNKRO_DEPENDENCY_READ_TOKEN }}
        run: |
          if [ -z "$SYNKRO_DEPENDENCY_READ_TOKEN" ]; then
            echo "Private dependency read access is required; use the documented local verifier when administration is unavailable."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: synkro-infra-postgres
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        working-directory: synkro-infra-postgres
        run: pip install -r requirements-test.txt
      - name: Retrieve immutable candidate and published dependency snapshots
        working-directory: synkro-infra-postgres
        run: |
          if [ -n "$SYNKRO_DEPENDENCY_READ_TOKEN" ]; then
            export GIT_ASKPASS="$PWD/scripts/dependency_askpass.sh"
          fi
          python scripts/fetch_dependencies.py
      - name: Protected files and historical SQL match recorded baselines
        working-directory: synkro-infra-postgres
        run: python scripts/verify_protected.py
      - name: PostgreSQL bootstrap, coexistence, permissions, persistence and disposable restore
        working-directory: synkro-infra-postgres
        run: python tests/integration.py
      - name: Existing Auth regression suite on its own disposable engine
        working-directory: synkro-infra-postgres
        run: python tests/db_regressions.py auth
      - name: Existing Products regression suite on its own disposable engine
        working-directory: synkro-infra-postgres
        run: python tests/db_regressions.py products
      - name: Actual Mongo infrastructure and supported Sales runner
        working-directory: synkro-infra-postgres
        run: node tests/mongo_sales.mjs
      - name: Published Mongo owner lifecycle and authorization recovery
        working-directory: synkro-infra-mongo
        run: |
          node tests/configuration.test.mjs
          node tests/integration.mjs
          node tests/sales-integration.mjs --sales-checkout ../synkro-sales-db
      - name: Published initial ADMIN CLI and existing Auth database verification
        working-directory: synkro-infra-postgres
        run: python tests/auth_initialization.py
      - name: Reconciled Sales runtime and owning Go MongoDB HTTP suite
        working-directory: synkro-infra-postgres
        run: python tests/sales_runtime.py
      - name: Collector, Prometheus and Grafana connectivity
        working-directory: synkro-infra-postgres
        run: python tests/observability.py
      - name: Host, Auth, Products and Sales compiled assets, coverage and outage recovery
        working-directory: synkro-infra-postgres
        run: python tests/portal_delivery.py
      - name: Real Customers, Products and Sales saga, recovery and public login
        working-directory: synkro-infra-postgres
        run: python tests/workflow_acceptance.py

  full-composition-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNKRO_DEPENDENCY_READ_TOKEN: ${{ secrets.SYNKRO_DEPENDENCY_READ_TOKEN }}
    steps:
      - name: Require explicitly approved private dependency access
        env:
          SYNKRO_DEPENDENCY_READ_TOKEN: ${{ secrets.SYNKRO_DEPENDENCY_READ_TOKEN }}
        run: |
          if [ -z "$SYNKRO_DEPENDENCY_READ_TOKEN" ]; then
            echo "Private dependency read access is required; use the documented local verifier when administration is unavailable."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: synkro-infra-postgres
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve immutable dependency snapshots
        working-directory: synkro-infra-postgres
        run: |
          if [ -n "$SYNKRO_DEPENDENCY_READ_TOKEN" ]; then
            export GIT_ASKPASS="$PWD/scripts/dependency_askpass.sh"
          fi
          python scripts/fetch_dependencies.py
      - name: Required deliveries must exist; missing stories fail CI
        working-directory: synkro-infra-postgres
        run: python tests/dependencies.py
