# Optional override: use with compose.yml, or as an include.path file list.
services:
  customers-db-migrate:
    environment:
      FLYWAY_PASSWORD_FILE: /run/secrets/customers_db_admin_password
    secrets:
      - customers_db_admin_password

secrets:
  customers_db_admin_password:
    file: ${CUSTOMERS_DB_ADMIN_PASSWORD_FILE:?Set CUSTOMERS_DB_ADMIN_PASSWORD_FILE to a protected absolute file path}
