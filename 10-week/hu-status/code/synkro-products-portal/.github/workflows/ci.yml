name: ci

on:
  push:
    branches: [develop, qa, main, fix/root-composition-integration]
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  check-common-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify root deployment contract
        run: python3 tests/test_root_deploy.py
      - name: Verify common repository files exist
        run: |
          set -e
          test -f README.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .env.example
          echo "Common files present."

  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The compiled portal has no gateway address and no token handling.
      - run: npm run check:compiled

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails if statement coverage drops below the floor set in vite.config.ts.
      - run: npm test -- --coverage

  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Builds the image without pushing it; the build itself runs the compiled-code check.
      - run: docker build -f deploy/Dockerfile -t synkro-products-portal:ci .
      # The template renders and nginx accepts the configuration.
      - run: docker run --rm -e HOST_ORIGIN=https://host.example synkro-products-portal:ci nginx -t
