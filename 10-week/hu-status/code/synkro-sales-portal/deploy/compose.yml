# This portal alone. The composition of the whole system lives in synkro-infra.
# Run it with the values of a .env that is never committed:
#   docker compose --env-file .env -f deploy/compose.yml up --build   # internal platform HTTP 80; browser delivery through the host
services:
  synkro-sales-portal:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/remotes/sales/}
        VITE_SHELL_ENTRY_URL: ${VITE_SHELL_ENTRY_URL:-http://localhost:5173/assets/remoteEntry.js}
    environment:
      HOST_ORIGIN: ${HOST_ORIGIN:-http://localhost:5173}
    expose: ["80"]
    networks: [platform]

networks:
  platform:
    external: true
