services:
  synkro-customers-api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?restricted Customers JDBC URL required}
      SPRING_DATASOURCE_USERNAME: customers_app
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-platform}
