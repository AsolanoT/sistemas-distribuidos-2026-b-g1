services:
  synkro-customers-api:
    environment:
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/customers_app_password
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    secrets: [customers_app_password, jwt_public_key]

secrets:
  customers_app_password:
    file: ${CUSTOMERS_APP_PASSWORD_FILE:?protected application password path required}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_HOST_FILE:?Auth public key path required}
