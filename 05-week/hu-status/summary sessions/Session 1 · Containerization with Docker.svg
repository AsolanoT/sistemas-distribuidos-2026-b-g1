<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D63ED"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1920" height="1200" fill="#F5F8FC"/>

  <!-- HEADER -->
  <text x="960" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#0A2540">Containerization with Docker</text>
  <text x="960" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#4A5568">Week 5 · Session 1 — Packaging services for a distributed system</text>
  <line x1="60" y1="122" x2="1860" y2="122" stroke="#CBD5E1" stroke-width="2"/>

  <!-- OBJECTIVES CHIPS -->
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="60" y="136" width="435" height="56" rx="28" fill="#0A2540"/>
      <circle cx="92" cy="164" r="16" fill="#1D63ED"/>
      <text x="92" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
      <text x="118" y="170" font-size="17" fill="#FFFFFF">Distinguish image, container and registry</text>
    </g>
    <g>
      <rect x="510" y="136" width="435" height="56" rx="28" fill="#0A2540"/>
      <circle cx="542" cy="164" r="16" fill="#1D63ED"/>
      <text x="542" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
      <text x="568" y="170" font-size="17" fill="#FFFFFF">Write a small, correct Dockerfile</text>
    </g>
    <g>
      <rect x="960" y="136" width="435" height="56" rx="28" fill="#0A2540"/>
      <circle cx="992" cy="164" r="16" fill="#1D63ED"/>
      <text x="992" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
      <text x="1018" y="170" font-size="17" fill="#FFFFFF">Run multiple services with Compose</text>
    </g>
    <g>
      <rect x="1410" y="136" width="450" height="56" rx="28" fill="#0A2540"/>
      <circle cx="1442" cy="164" r="16" fill="#1D63ED"/>
      <text x="1442" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
      <text x="1468" y="170" font-size="17" fill="#FFFFFF">Handle config (env) and data (volumes)</text>
    </g>
  </g>

  <!-- SECTION 1: Image vs Container vs Registry -->
  <g font-family="Arial, sans-serif">
    <rect x="60" y="212" width="560" height="218" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="60" y="212" width="10" height="218" rx="5" fill="#1D63ED"/>
    <text x="92" y="248" font-size="24" font-weight="700" fill="#0A2540">Why containers?</text>
    <text x="92" y="282" font-size="18" fill="#334155">A container packages the service</text>
    <text x="92" y="306" font-size="18" fill="#334155">with everything it needs: runtime,</text>
    <text x="92" y="330" font-size="18" fill="#334155">libraries and configuration.</text>
    <text x="92" y="362" font-size="18" fill="#334155">Runs the same on any machine:</text>
    <text x="92" y="386" font-size="18" fill="#334155">no more "it works on my machine".</text>
    <text x="92" y="416" font-size="18" font-weight="700" fill="#1D63ED">Same artifact in dev, qa and prod.</text>

    <text x="660" y="238" font-size="24" font-weight="700" fill="#0A2540">Image · Container · Registry</text>

    <!-- Dockerfile box -->
    <rect x="680" y="278" width="185" height="110" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="772" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#0A2540">Dockerfile</text>
    <text x="772" y="348" text-anchor="middle" font-size="14" fill="#4A5568">the recipe</text>

    <path d="M865,333 L933,333" stroke="#1D63ED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="899" y="322" text-anchor="middle" font-size="13" fill="#1D63ED">build</text>

    <!-- Image box -->
    <rect x="935" y="278" width="185" height="110" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="1027" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#0A2540">Image</text>
    <text x="1027" y="348" text-anchor="middle" font-size="14" fill="#4A5568">immutable template</text>

    <path d="M1120,333 L1188,333" stroke="#1D63ED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1154" y="322" text-anchor="middle" font-size="13" fill="#1D63ED">run</text>

    <!-- Container box -->
    <rect x="1190" y="278" width="185" height="110" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="1282" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#0A2540">Container</text>
    <text x="1282" y="348" text-anchor="middle" font-size="14" fill="#4A5568">live instance</text>

    <!-- Registry box, connected to Image with a curved push/pull arrow above Container -->
    <path d="M1027,278 C1027,232 1590,232 1590,278" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrowGray)" marker-start="url(#arrowGray)"/>
    <text x="1308" y="228" text-anchor="middle" font-size="14" fill="#64748B">push / pull</text>

    <rect x="1495" y="278" width="190" height="110" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="1590" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#0A2540">Registry</text>
    <text x="1590" y="348" text-anchor="middle" font-size="14" fill="#4A5568">Docker Hub / GHCR</text>
  </g>

  <!-- SECTION 2: Dockerfile multi-stage -->
  <g font-family="Arial, sans-serif">
    <rect x="60" y="452" width="560" height="218" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="60" y="452" width="10" height="218" rx="5" fill="#1D63ED"/>
    <text x="92" y="488" font-size="24" font-weight="700" fill="#0A2540">Multi-stage Dockerfile</text>
    <text x="92" y="522" font-size="18" fill="#334155">Build in one stage, ship a small</text>
    <text x="92" y="546" font-size="18" fill="#334155">runtime image in another.</text>
    <text x="92" y="578" font-size="18" fill="#334155">Order layers from least- to</text>
    <text x="92" y="602" font-size="18" fill="#334155">most-changing, so caching helps.</text>
    <text x="92" y="634" font-size="18" font-weight="700" fill="#DC2626">Never bake secrets into the image.</text>

    <!-- Stage A -->
    <rect x="680" y="472" width="520" height="178" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="710" y="506" font-size="21" font-weight="700" fill="#0A2540">Stage 1 — Build</text>
    <text x="710" y="534" font-size="16" fill="#334155">maven:3.9-eclipse-temurin-21</text>
    <text x="710" y="560" font-size="16" fill="#334155">WORKDIR /app</text>
    <text x="710" y="586" font-size="16" fill="#334155">COPY pom.xml → dependencies (cache)</text>
    <text x="710" y="612" font-size="16" fill="#334155">COPY src → mvn package</text>

    <path d="M1200,561 L1280,561" stroke="#1D63ED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="1240" y="548" text-anchor="middle" font-size="13" fill="#1D63ED">COPY --from=build</text>

    <!-- Stage B -->
    <rect x="1300" y="472" width="520" height="178" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="1330" y="506" font-size="21" font-weight="700" fill="#0A2540">Stage 2 — Runtime</text>
    <text x="1330" y="534" font-size="16" fill="#334155">eclipse-temurin:21-jre (small)</text>
    <text x="1330" y="560" font-size="16" fill="#334155">COPY --from=build app.jar</text>
    <text x="1330" y="586" font-size="16" fill="#334155">EXPOSE 8080</text>
    <text x="1330" y="612" font-size="16" fill="#334155">ENTRYPOINT java -jar app.jar</text>
  </g>

  <!-- SECTION 3: Docker Compose -->
  <g font-family="Arial, sans-serif">
    <rect x="60" y="692" width="560" height="218" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="60" y="692" width="10" height="218" rx="5" fill="#1D63ED"/>
    <text x="92" y="728" font-size="24" font-weight="700" fill="#0A2540">Many services at once</text>
    <text x="92" y="762" font-size="18" fill="#334155">A distributed system is several</text>
    <text x="92" y="786" font-size="18" fill="#334155">containers that must start together</text>
    <text x="92" y="810" font-size="18" fill="#334155">and talk to each other.</text>
    <text x="92" y="842" font-size="18" fill="#334155">Docker Compose declares them in one</text>
    <text x="92" y="866" font-size="18" fill="#334155">docker-compose.yml, on a shared</text>
    <text x="92" y="890" font-size="18" fill="#334155">network, with dependencies and env.</text>

    <!-- network box -->
    <rect x="680" y="722" width="1140" height="188" rx="14" fill="#F8FAFC" stroke="#1D63ED" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="708" y="754" font-size="17" font-weight="700" fill="#1D63ED">docker network: appnet</text>

    <rect x="710" y="774" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="830" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2540">orders-api</text>
    <text x="830" y="836" text-anchor="middle" font-size="14" fill="#4A5568">service</text>

    <rect x="985" y="774" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#1D63ED" stroke-width="2"/>
    <text x="1105" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2540">inventory-api</text>
    <text x="1105" y="836" text-anchor="middle" font-size="14" fill="#4A5568">service</text>

    <rect x="1260" y="774" width="240" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="1380" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2540">postgres</text>
    <text x="1380" y="836" text-anchor="middle" font-size="14" fill="#4A5568">database</text>

    <rect x="1535" y="774" width="240" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="1655" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#0A2540">redis</text>
    <text x="1655" y="836" text-anchor="middle" font-size="14" fill="#4A5568">cache</text>

    <text x="1250" y="892" text-anchor="middle" font-size="15" fill="#334155">They reach each other by name — http://inventory-api:8080 — never by IP.</text>
  </g>

  <!-- SECTION 4: three columns -->
  <g font-family="Arial, sans-serif">
    <!-- col1 caution -->
    <rect x="60" y="932" width="580" height="238" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="60" y="932" width="10" height="238" rx="5" fill="#D97706"/>
    <text x="92" y="968" font-size="21" font-weight="700" fill="#0A2540">Config and data don't go in the image</text>
    <text x="92" y="998" font-size="16" fill="#334155">Config → environment variables</text>
    <text x="92" y="1020" font-size="16" fill="#334155">(DB URL, secrets, hostnames).</text>
    <text x="92" y="1050" font-size="16" fill="#334155">Data → the container is disposable;</text>
    <text x="92" y="1072" font-size="16" fill="#334155">use volumes for databases.</text>
    <text x="92" y="1104" font-size="16" font-weight="700" fill="#B45309">Otherwise: insecure, non-portable</text>
    <text x="92" y="1126" font-size="16" font-weight="700" fill="#B45309">deployments that lose data.</text>

    <!-- col2 example -->
    <rect x="670" y="932" width="580" height="238" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="670" y="932" width="10" height="238" rx="5" fill="#1D63ED"/>
    <text x="702" y="968" font-size="21" font-weight="700" fill="#0A2540">Real case: the 1.2 GB leaky image</text>
    <text x="702" y="998" font-size="16" fill="#334155">"COPY . ." grabs everything: .env,</text>
    <text x="702" y="1020" font-size="16" fill="#334155">.git, node_modules...</text>
    <text x="702" y="1050" font-size="16" fill="#334155">Result: huge image, slow to ship,</text>
    <text x="702" y="1072" font-size="16" fill="#334155">with the secret exposed in a layer.</text>
    <text x="702" y="1104" font-size="16" font-weight="700" fill="#16A34A">Fix: multi-stage + .dockerignore</text>
    <text x="702" y="1126" font-size="16" font-weight="700" fill="#16A34A">+ env config, no secrets in image.</text>

    <!-- col3 mistakes -->
    <rect x="1280" y="932" width="580" height="238" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="1280" y="932" width="10" height="238" rx="5" fill="#DC2626"/>
    <text x="1312" y="968" font-size="21" font-weight="700" fill="#0A2540">Common mistakes</text>
    <text x="1312" y="1000" font-size="16" fill="#334155">• Single-stage images that ship the</text>
    <text x="1330" y="1020" font-size="16" fill="#334155">whole build toolchain</text>
    <text x="1312" y="1046" font-size="16" fill="#334155">• Secrets/.env copied into the image</text>
    <text x="1312" y="1072" font-size="16" fill="#334155">• Database stored inside the container</text>
    <text x="1330" y="1092" font-size="16" fill="#334155">(data lost on restart)</text>
    <text x="1312" y="1118" font-size="16" fill="#334155">• Hard-coded IPs instead of service</text>
    <text x="1330" y="1138" font-size="16" fill="#334155">names on the network</text>
  </g>
</svg>
