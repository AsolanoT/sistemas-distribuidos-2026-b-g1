openapi: 3.0.3
info:
  title: SynkroTech — Shared Components
  version: 1.0.0
  description: >
    Components referenced by every service contract in this folder through
    $ref: the error envelope and its closed catalog of codes, list pagination,
    the Idempotency-Key and X-Correlation-Id headers, common error responses
    and the security scheme. Not a standalone API: it has no paths of its own.
    The conventions behind each component are in 07-api/guidelines.md.

servers:
  - url: http://localhost:8000
    description: Local gateway (the only published entry point)

paths: {}

components:
  schemas:
    Error:
      type: object
      required: [error, message, traceId]
      description: >
        The only error envelope of the system, for every 4xx and 5xx response,
        including unknown routes and malformed JSON. It never contains a driver
        message, a stack trace or an internal host name.
      properties:
        error:
          type: string
          description: >
            Closed catalog (07-api/guidelines.md). TOO_MANY_REQUESTS and
            SERVICE_UNAVAILABLE are returned only by the gateway.
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - INVALID_STATUS_TRANSITION
            - BUSINESS_RULE_VIOLATION
            - INTERNAL_ERROR
            - TOO_MANY_REQUESTS
            - SERVICE_UNAVAILABLE
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable message, in English.
          example: The email field is required
        details:
          type: array
          description: >
            Per-field detail, present on validation errors and when a business
            rule names the field.
          items:
            $ref: '#/components/schemas/ErrorDetail'
        traceId:
          type: string
          description: The request's X-Correlation-Id.
          example: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: required

    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      description: Pagination metadata returned with every list.
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 142
        totalPages:
          type: integer
          minimum: 0
          example: 8

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page, from 1 to 100. Out of range answers 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on every creation. The first request answers 201 with Location;
        the same key again answers 200 with the same resource and creates
        nothing. The saga sends <sagaId>:<step>.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Reused if sent; generated by the gateway otherwise. Returned in every
        response and used as the traceId of any error.
      schema:
        type: string

  headers:
    XCorrelationId:
      description: The correlation ID of the request.
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri

  responses:
    BadRequest:
      description: Validation error, unknown filter, limit out of range or missing Idempotency-Key.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: VALIDATION_ERROR
            message: The email field is required
            details:
              - field: email
                message: required
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90
    Unauthorized:
      description: Token missing, expired, malformed or with an invalid signature.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
            message: Missing or invalid authentication token
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90
    Forbidden:
      description: Valid token, but its roles or permissions do not allow the operation.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            message: Role INVENTORY is not authorized to create sales
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90
    NotFound:
      description: The resource does not exist or is not active.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
            message: Resource not found
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90
    UnprocessableEntity:
      description: >
        A business rule (BUSINESS_RULE_VIOLATION) or the resource's current
        status (INVALID_STATUS_TRANSITION) rejects the request.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: BUSINESS_RULE_VIOLATION
            message: Requested quantity exceeds available stock
            details:
              - field: lines[0].quantity
                message: exceeds available stock
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90
    InternalError:
      description: Unexpected failure; the detail goes only to the log.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL_ERROR
            message: Unexpected error
            traceId: 4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 JWT issued by synkro-auth-api and validated by every service that
        receives the request (ADR-006); the gateway only checks that it is
        present. Internal calls use the caller's service token. See
        07-api/authentication.md.
