openapi: 3.0.3
info:
  title: SynkroTech — Shared Components
  version: 1.0.0
  description: >
    Reusable schemas and parameters referenced by every service contract
    in this folder via $ref. Not a standalone API — has no paths of its
    own.

components:
  schemas:
    Error:
      type: object
      required: [error, message]
      description: >
        Standard error envelope for every 4xx/5xx response across all
        SynkroTech services. See 07-api/guidelines.md, "Error format".
      properties:
        error:
          type: string
          description: Stable SCREAMING_SNAKE_CASE error code.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable message, in English.
          example: The email field is required
        details:
          type: array
          description: >
            Field-by-field error list, present only on 400/422
            validation errors.
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: required

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 JWT issued by auth-service, validated once at
        synkro-api-gateway (ADR-003 §2). See 07-api/authentication.md.
